[project]
name = "superset-openwakeword"
version = "0.1.0"
description = "Local wake-word detection sidecar for Superset voice control"
requires-python = ">=3.9"
dependencies = [
    "openwakeword>=0.6.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
